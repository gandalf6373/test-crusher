<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="1480" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7EFE5"/>
      <stop offset="0.45" stop-color="#F5D7BF"/>
      <stop offset="1" stop-color="#DCE6F2"/>
    </linearGradient>
    <linearGradient id="panel" x1="220" y1="180" x2="1380" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10243A" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#1A3550" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="flow" x1="670" y1="420" x2="930" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316"/>
      <stop offset="0.5" stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
    <linearGradient id="leftCard" x1="250" y1="250" x2="560" y2="540" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD7C3"/>
      <stop offset="1" stop-color="#F2B8A0"/>
    </linearGradient>
    <linearGradient id="rightCard" x1="1030" y1="250" x2="1350" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7ED"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#0B1320" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="140" r="150" fill="#FFF5D6" fill-opacity="0.7" filter="url(#soft)"/>
  <circle cx="250" cy="760" r="170" fill="#F9C6A4" fill-opacity="0.45" filter="url(#soft)"/>
  <circle cx="1130" cy="760" r="200" fill="#BFD8F0" fill-opacity="0.45" filter="url(#soft)"/>

  <rect x="120" y="90" width="1360" height="720" rx="36" fill="url(#panel)" filter="url(#shadow)"/>

  <text x="180" y="180" fill="#FFF6ED" font-size="68" font-weight="800" font-family="Arial, Helvetica, sans-serif">test-crusher</text>
  <text x="180" y="228" fill="#F9D9C6" font-size="26" font-weight="600" font-family="Arial, Helvetica, sans-serif">把手工整理测试用例，压缩成一次生成</text>
  <text x="180" y="272" fill="#C7D6E5" font-size="24" font-weight="400" font-family="Arial, Helvetica, sans-serif">从开发功能点到可审核 Excel，让 QA 把时间花在判断质量，而不是搬运表格。</text>

  <rect x="180" y="312" width="214" height="46" rx="23" fill="#F97316"/>
  <text x="210" y="342" fill="#FFF7ED" font-size="22" font-weight="700" font-family="Arial, Helvetica, sans-serif">几十秒产出初稿</text>
  <rect x="410" y="312" width="214" height="46" rx="23" fill="#FFD38A"/>
  <text x="444" y="342" fill="#3F2B16" font-size="22" font-weight="700" font-family="Arial, Helvetica, sans-serif">信息不足先拦截</text>

  <text x="220" y="420" fill="#FFD7C3" font-size="30" font-weight="800" font-family="Arial, Helvetica, sans-serif">手工模式</text>
  <text x="1030" y="420" fill="#FFF2C7" font-size="30" font-weight="800" font-family="Arial, Helvetica, sans-serif">test-crusher 模式</text>

  <g transform="rotate(-7 395 520)">
    <rect x="210" y="450" width="280" height="118" rx="22" fill="url(#leftCard)"/>
    <text x="242" y="495" fill="#582A1C" font-size="28" font-weight="800" font-family="Arial, Helvetica, sans-serif">研发任务拆解</text>
    <text x="242" y="530" fill="#7A4531" font-size="21" font-family="Arial, Helvetica, sans-serif">字段散、信息杂、要自己看</text>
  </g>

  <g transform="rotate(5 470 610)">
    <rect x="300" y="565" width="300" height="122" rx="22" fill="#F7C6B4"/>
    <text x="334" y="612" fill="#582A1C" font-size="28" font-weight="800" font-family="Arial, Helvetica, sans-serif">手工补步骤</text>
    <text x="334" y="647" fill="#7A4531" font-size="21" font-family="Arial, Helvetica, sans-serif">页面入口、点击路径、提示文案</text>
  </g>

  <g transform="rotate(-4 225 655)">
    <rect x="190" y="610" width="260" height="116" rx="22" fill="#EFB19B"/>
    <text x="220" y="654" fill="#582A1C" font-size="26" font-weight="800" font-family="Arial, Helvetica, sans-serif">补边界场景</text>
    <text x="220" y="688" fill="#7A4531" font-size="20" font-family="Arial, Helvetica, sans-serif">必填、重复、异常、状态流转</text>
  </g>

  <g transform="rotate(8 505 730)">
    <rect x="390" y="705" width="260" height="106" rx="22" fill="#D99382"/>
    <text x="425" y="747" fill="#FFF4EC" font-size="26" font-weight="800" font-family="Arial, Helvetica, sans-serif">整理 Excel</text>
    <text x="425" y="779" fill="#FFE6D8" font-size="20" font-family="Arial, Helvetica, sans-serif">审核后还可能返工</text>
  </g>

  <path d="M660 530C710 500 760 488 810 488C860 488 910 500 960 530" stroke="url(#flow)" stroke-width="18" stroke-linecap="round"/>
  <path d="M926 498L990 530L926 562" fill="none" stroke="#FDBA74" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="810" cy="530" r="82" fill="#15314D" stroke="#F6B26B" stroke-width="6"/>
  <text x="742" y="522" fill="#FFF3E8" font-size="24" font-weight="800" font-family="Arial, Helvetica, sans-serif">test-</text>
  <text x="730" y="556" fill="#FFF3E8" font-size="34" font-weight="900" font-family="Arial, Helvetica, sans-serif">crusher</text>

  <rect x="1015" y="450" width="315" height="120" rx="24" fill="url(#rightCard)"/>
  <text x="1050" y="494" fill="#49331A" font-size="28" font-weight="800" font-family="Arial, Helvetica, sans-serif">结构化输入</text>
  <text x="1050" y="530" fill="#6D573E" font-size="21" font-family="Arial, Helvetica, sans-serif">Markdown / Excel 开发点直接投喂</text>

  <rect x="1090" y="585" width="292" height="116" rx="24" fill="#FFF3D0"/>
  <text x="1123" y="628" fill="#49331A" font-size="28" font-weight="800" font-family="Arial, Helvetica, sans-serif">自动补齐场景</text>
  <text x="1123" y="664" fill="#6D573E" font-size="21" font-family="Arial, Helvetica, sans-serif">正向 / 异常 / 边界一起生成</text>

  <rect x="1000" y="710" width="350" height="82" rx="22" fill="#F59E0B"/>
  <text x="1036" y="762" fill="#FFF9EE" font-size="30" font-weight="900" font-family="Arial, Helvetica, sans-serif">可审核测试用例 Excel</text>

  <circle cx="988" cy="735" r="8" fill="#F6B26B"/>
  <circle cx="988" cy="764" r="8" fill="#F6B26B"/>
  <circle cx="988" cy="793" r="8" fill="#F6B26B"/>

  <text x="183" y="786" fill="#8FB0CC" font-size="18" font-family="Arial, Helvetica, sans-serif">QA productivity banner for README hero</text>
</svg>
